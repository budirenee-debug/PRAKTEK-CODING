# Cloudflare Tunnel - B_gadget POS Service HP
# Dokumentasi: https://developers.cloudflare.com/cloudflare-one/connections/connect/
# File ini: .cloudflared/config.yml (project) | default global: %USERPROFILE%\.cloudflared\config.yml
# Fix P1-9: pakai path relatif/portable — run.bat otomatis resolve %USERPROFILE%\.cloudflared\*.json

tunnel: b-gadget
# Portable: credentials-file mendukung %USERPROFILE% (di-resolve run.bat) dan fallback .cloudflared/*.json relatif
# Jika pakai named tunnel, letakkan file JSON di %USERPROFILE%\.cloudflared\ atau .cloudflared\ (repo)
# Contoh: C:\Users\Br\.cloudflared\debc4532-0e35-4364-967d-9d8f50344e3e.json
credentials-file: C:\Users\Br\.cloudflared\debc4532-0e35-4364-967d-9d8f50344e3e.json
# Alternatif portable (jika pindah PC, copy JSON ke .cloudflared\ dan ubah baris di atas menjadi):
# credentials-file: .cloudflared/debc4532-0e35-4364-967d-9d8f50344e3e.json
# Legacy (PC lama, tunnel ID lama - sudah dihapus 2026-09-16): C:\Users\budirenee\.cloudflared\4482781b-c05e-4348-ae22-1739a7a80b83.json

# Optional: log level
# loglevel: info

ingress:
  # Domain utama -> Backend FastAPI (port 8000) sudah mount /frontend & /assets
  # Backend run: uvicorn app.main:app --host 0.0.0.0 --port 8000  (backend/run.py & run.bat:75)
  - hostname: service.reneepsl.my.id
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      httpHostHeader: service.reneepsl.my.id

  - hostname: reneepsl.my.id
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      httpHostHeader: reneepsl.my.id

  - hostname: www.reneepsl.my.id
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      httpHostHeader: www.reneepsl.my.id

  # Catch-all WAJIB di paling bawah (404 jika hostname tidak cocok)
  - service: http_status:404
