<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Owner — BOS SERVICE</title>
  <meta name="description" content="Login khusus owner/admin BOS SERVICE — menuju Owner Space (pengaturan toko + laporan keuangan).">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=black2">
  <link rel="stylesheet" href="assets/css/bos.css?v=mobile1">
  <style>
    .login-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f6f6f7;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
    .login-card{background:#fff;border:1px solid #ececec;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .login-card h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;margin-bottom:4px}
    .login-card .tagline{color:#8a8f98;font-size:12.5px;margin-bottom:20px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field label{font-size:12px;font-weight:600}
    .field input{padding:11px 12px;border:1px solid #ececec;border-radius:12px;background:#fcfcfc;font-size:14px;outline:0}
    .field input:focus{border-color:#04074a;background:#fff}
    .alert{padding:10px 12px;border-radius:12px;font-size:13px;display:none;margin-bottom:12px}
    .alert.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .alert.ok{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
    .owner-badge{display:inline-block;font-size:11px;font-weight:700;background:#04074a;color:#fff;border-radius:20px;padding:3px 10px;margin-bottom:10px;letter-spacing:.3px}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <a href="landing.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span style="width:44px;height:44px;background:#04074a;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px">BOS</span>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700">Owner Space<br><span style="font-family:Inter;font-weight:400;font-size:11px;color:#8a8f98">Pengaturan toko + laporan keuangan</span></span>
      </a>
      <span class="owner-badge">🏪 LOGIN OWNER / ADMIN</span>
      <h1>Masuk Owner</h1>
      <p class="tagline">Khusus owner &amp; admin toko • teknisi/kasir lewat <a href="login.html">login toko →</a></p>

      <div id="alert" class="alert"></div>

      <form id="loginForm" onsubmit="handleOwnerLogin(event)" autocomplete="off">
        <div class="field"><label>Username</label><input id="username" required value="" placeholder="Username owner/admin" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label>Password</label><input id="password" type="password" required value="" placeholder="Masukkan password" autocomplete="new-password"></div>
        <button class="btn btn-dark" style="width:100%;margin-top:8px" type="submit">Masuk ke Owner Space →</button>
      </form>

      <div style="margin-top:14px;font-size:12px;color:#8a8f98;text-align:center"><a href="landing.html">← Beranda</a> • <a href="login.html">Login toko (kasir/teknisi)</a> • <a href="lacak.html">🔍 Lacak Service</a></div>
    </div>
  </div>
  <script src="assets/js/auth.js?v=idx1"></script>
  <script>
    const API = (window.BOSAuth ? window.BOSAuth.API : (() => {
      const stored = localStorage.getItem('API_BASE');
      if (stored) return stored;
      const proto = location.protocol;
      const host = location.hostname;
      if (proto === 'file:') return 'http://127.0.0.1:8000/api';
      if (host === 'localhost' || host === '127.0.0.1') return 'http://127.0.0.1:8000/api';
      if (!host || host === 'null') return 'http://127.0.0.1:8000/api';
      return location.origin + '/api';
    })());

    window.addEventListener('load', () => {
      setTimeout(() => {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u) u.value = '';
        if (p) p.value = '';
      }, 100);
    });

    function showMsg(kind, msg){
      const alert = document.getElementById('alert');
      alert.className = 'alert ' + kind; alert.textContent = msg; alert.style.display = 'block';
    }

    // Sudah login owner tapi pencet Back → langsung ke index.html (dashboard toko).
    async function bounceIfOwner(){
      let token = null;
      try{ token = window.BOSAuth ? window.BOSAuth.getToken() : localStorage.getItem('access_token'); }catch(e){}
      if(!token) return;
      try{
        const res = await fetch(`${API}/auth/me`, {headers:{'Authorization':`Bearer ${token}`}});
        if(res.ok){
          const me = await res.json().catch(()=>null);
          try{ if(me && me.role) localStorage.setItem('role', String(me.role).toLowerCase()); }catch(e){}
          const role = window.BOSAuth ? window.BOSAuth.myActiveRole() : String((me && me.role) || '').toLowerCase();
          if(['superadmin','owner','admin'].includes(role)) location.replace('index.html');
          // teknisi/kasir: biarkan di halaman ini agar dapat pesan penolakan jelas saat login ulang
        }
        else if(res.status === 401){
          try{ if(window.BOSAuth) window.BOSAuth.logout(true); else localStorage.removeItem('access_token'); }catch(e){}
        }
      }catch(e){}
    }
    window.addEventListener('pageshow', bounceIfOwner);
    bounceIfOwner();

    async function handleOwnerLogin(e){
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      document.getElementById('alert').style.display = 'none';
      try{
        const res = await fetch(`${API}/auth/login`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p})
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.detail || 'Gagal login');
        // Simpan dulu agar myActiveRole (per-toko) bisa dihitung
        if(window.BOSAuth) window.BOSAuth.saveLogin(data);
        else {
          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('username', data.username);
          localStorage.setItem('role', data.role);
          localStorage.setItem('bos_stores', JSON.stringify(data.stores || []));
          if(data.primary_store_id) localStorage.setItem('active_store_id', String(data.primary_store_id));
        }
        const role = window.BOSAuth ? window.BOSAuth.myActiveRole() : String(data.role || '').toLowerCase();
        if(!['superadmin','owner','admin'].includes(role)){
          try{ if(window.BOSAuth) window.BOSAuth.logout(true); else localStorage.removeItem('access_token'); }catch(e){}
          throw new Error('⛔ Akun "' + u + '" (' + (role || 'tanpa peran') + ') bukan owner/admin. Pakai login toko untuk kasir/teknisi.');
        }
        showMsg('ok', 'Berhasil! Membuka Dashboard Toko...');
        setTimeout(()=> location.replace('index.html'), 600);
      }catch(err){
        showMsg('err', String(err.message || 'Gagal login'));
      }
    }
  </script>
</body>
</html>
