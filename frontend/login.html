<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — BOS SERVICE</title>
  <meta name="description" content="Masuk ke BOS SERVICE (Bisnis Operasional System) — platform service HP & laptop multi-toko.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/bos.css">
  <style>
    .login-wrap{min-height:100vh;display:grid;place-items:center;background:#f6f6f7;padding:24px}
    .login-card{background:#fff;border:1px solid #ececec;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .login-card h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;margin-bottom:4px}
    .login-card .tagline{color:#8a8f98;font-size:12.5px;margin-bottom:20px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    .field label{font-size:12px;font-weight:600}
    .field input{padding:11px 12px;border:1px solid #ececec;border-radius:12px;background:#fcfcfc;font-size:14px;outline:0}
    .field input:focus{border-color:#111;background:#fff}
    .alert{padding:10px 12px;border-radius:12px;font-size:13px;display:none;margin-bottom:12px}
    .alert.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
    .alert.ok{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
    .invite-note{font-size:12px;color:#8a8f98;background:#f6f6f7;border:1px dashed #d9d9de;border-radius:12px;padding:10px 12px;margin-top:14px;text-align:center}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <a href="landing.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span style="width:44px;height:44px;background:#111;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px">BOS</span>
        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700">BOS SERVICE<br><span style="font-family:Inter;font-weight:400;font-size:11px;color:#8a8f98">Bisnis Operasional System</span></span>
      </a>
      <h1>Masuk</h1>
      <p class="tagline">Platform service HP &amp; laptop • satu akun untuk banyak toko</p>

      <div id="alert" class="alert"></div>

      <!-- FORM LOGIN (kontrak API tidak berubah: POST /api/auth/login) -->
      <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
        <div class="field"><label>Username</label><input id="username" required value="" placeholder="Masukkan username" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label>Password</label><input id="password" type="password" required value="" placeholder="Masukkan password" autocomplete="new-password"></div>
        <button class="btn btn-dark" style="width:100%;margin-top:8px" type="submit">Masuk →</button>
      </form>

      <div class="invite-note">🔒 Pendaftaran <strong>invite-only</strong> — belum punya akun? <a href="register.html" style="font-weight:600">Daftar dengan kode undangan →</a></div>

      <div style="margin-top:14px;font-size:12px;color:#8a8f98;text-align:center"><a href="landing.html">← Beranda</a> • <a href="index.html">Dashboard POS</a></div>
    </div>
  </div>
  <script>
    // Dynamic API: file:// -> 127.0.0.1:8000 IPv4 only (fix IPv6)
    const API = (() => {
      const stored = localStorage.getItem('API_BASE');
      if (stored) return stored;
      const proto = location.protocol;
      const host = location.hostname;
      if (proto === 'file:') return 'http://127.0.0.1:8000/api';
      if (host === 'localhost' || host === '127.0.0.1') return 'http://127.0.0.1:8000/api';
      if (!host || host === 'null') return 'http://127.0.0.1:8000/api';
      return location.origin + '/api';
    })();

    // cegah browser autofill menampilkan kredensial lama
    window.addEventListener('load', () => {
      setTimeout(() => {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u) u.value = '';
        if (p) p.value = '';
      }, 100);
    });

    async function handleLogin(e){
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const alert = document.getElementById('alert');
      alert.style.display='none';
      try{
        const res = await fetch(`${API}/auth/login`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username:u, password:p})
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.detail || 'Gagal login');
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('username', data.username);
        localStorage.setItem('role', data.role);
        // BOS multi-toko: simpan daftar toko + set toko aktif
        localStorage.setItem('bos_stores', JSON.stringify(data.stores || []));
        if(data.primary_store_id){
          localStorage.setItem('active_store_id', String(data.primary_store_id));
        }
        alert.className='alert ok'; alert.textContent='Berhasil! Mengalihkan...'; alert.style.display='block';
        setTimeout(()=> location.href='index.html', 800);
      }catch(err){
        // khusus pending approval
        const msg = err.message.includes('persetujuan') ? '⏳ ' + err.message : err.message;
        alert.className='alert err'; alert.textContent=msg; alert.style.display='block';
      }
    }
  </script>
</body>
</html>
